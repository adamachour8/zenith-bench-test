[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Librairies — les capteurs du bench test
lib_deps =
    finani/ICM42688@^0.1.3
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library@^1.0.6
    nRF24/RF24@^1.4.9
    ttlappalainen/NMEA2000@^4.21.3

; Fréquence du serial monitor (UART debug)
monitor_speed = 115200

; Flags de compilation
build_flags =
    -D SERIAL_BAUD=115200
    -Wall